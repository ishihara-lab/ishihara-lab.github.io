<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja-JP' }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#427fad">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
    <link rel="stylesheet" href="{{ '/assets/css/preview.css' | relative_url }}">
  </head>
  <body class="preview-page">
    <a id="skip-to-content" href="#content">本文へ移動</a>
    <header class="preview-sky" role="banner">
      <div class="preview-clouds" aria-hidden="true">
        <span class="sky-cloud sky-cloud-one"></span>
        <span class="sky-cloud sky-cloud-two"></span>
        <span class="sky-cloud sky-cloud-three"></span>
        <span class="sky-cloud sky-cloud-four"></span>
        <span class="sky-cloud sky-cloud-five"></span>
      </div>
      <div class="preview-sky-content">
        <p class="preview-label">ISHIHARA LAB / NANZAN UNIVERSITY</p>
        <h1>石原研究室</h1>
        <p class="preview-affiliation">
          <a href="https://www.nanzan-u.ac.jp" target="_blank" rel="noopener noreferrer">南山大学</a><span aria-hidden="true"> / </span>
          <a href="https://www.st.nanzan-u.ac.jp" target="_blank" rel="noopener noreferrer">理工学部</a><span aria-hidden="true"> / </span>
          <a href="https://www.st.nanzan-u.ac.jp/tc" target="_blank" rel="noopener noreferrer">電子情報工学科</a>
        </p>
      </div>
      <div class="preview-sky-fragments" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <p class="preview-sky-caption" aria-hidden="true"><span>SCROLL ↓</span></p>
    </header>
    <main id="content" class="preview-content" tabindex="-1">
      {{ content }}
    </main>
    <div class="preview-city" aria-hidden="true"></div>
      <footer class="site-footer">
        <div class="preview-footer-inner">
        {% if site.github.is_project_page %}
          <span class="site-footer-owner"><a href="{{ site.github.repository_url }}">{{ site.github.repository_name }}</a> is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a>.</span>
        {% endif %}
        <span class="site-footer-credits">This site is powered by <a href="https://pages.github.com" target="_blank" rel="noopener noreferrer">GitHub Pages</a> and <a href="https://claude.com/product/claude-code" target="_blank" rel="noopener noreferrer">Claude Code</a>.</span>
        </div>
      </footer>
  </body>
</html>
